# Settings
save-position-on-quit

# Interface
term-playing-msg="\n\x1b[1;36mNow Playing\x1b[0m: \x1b[32m${media-title}\x1b[0m"
term-status-msg="\r\x1b[K${!pause==yes:\x1b[32m⏵}${?pause==yes:\x1b[1;33m⏸}\x1b[0m ${time-pos} / \x1b[1m${duration}\x1b[22m \x1b[32m(${percent-pos}%)\x1b[0m  \x1b[90m•\x1b[0m  Speed: \x1b[1m${speed}x\x1b[22m  \x1b[90m•\x1b[0m  Vol: ${?mute==yes:\x1b[31m\u2205}${!mute==yes:\x1b[1m${volume}%}\x1b[0m"

msg-level="cplayer=warn"
osd-level=0

# Video Playback
vo=kitty,tct
profile=sw-fast
